services:
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: todo_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: todo-backend:ec2
    container_name: todo-backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://todo-summary-db.cvu4ka6oe0m1.ap-south-1.rds.amazonaws.com:3306/todo_db?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todo-network

  frontend:
    image: todo-frontend:ec2
    container_name: todo-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - todo-network

networks:
  todo-network:

volumes:
  mysql-data:
